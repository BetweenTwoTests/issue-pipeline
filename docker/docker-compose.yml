name: issue-pipeline

services:
  postgres:
    image: postgres:16-alpine
    container_name: ipl-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5433:5432"
    volumes:
      - ipl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The backend app's own database (Prisma), deliberately a separate server
  # from Temporal's postgres above -- app schema changes and `infra-nuke`
  # experiments on one must never touch the other's data.
  app-postgres:
    image: postgres:18-alpine
    container_name: ipl-app-postgres
    environment:
      POSTGRES_USER: issue_pipeline
      POSTGRES_PASSWORD: issue_pipeline
      POSTGRES_DB: issue_pipeline
    ports:
      - "5434:5432"
    volumes:
      # postgres 18+ images keep data in a versioned subdirectory and expect
      # the mount at /var/lib/postgresql (not the pre-18 .../data path, which
      # the entrypoint rejects as an "unused mount").
      - ipl-app-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issue_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: ipl-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      DEFAULT_NAMESPACE: issue-pipeline
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    ports:
      - "7833:7233"
    healthcheck:
      # temporal-server --env docker binds to the container's bridge-network
      # IP, not loopback, so a 127.0.0.1 check always fails; the compose
      # service name resolves correctly even from within the same container.
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.48.0
    container_name: ipl-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_ADDRESS: "0.0.0.0:8080"
      TEMPORAL_DEFAULT_NAMESPACE: issue-pipeline
      TEMPORAL_CORS_ORIGINS: "http://localhost:8833"
    ports:
      - "8833:8080"

volumes:
  ipl-pgdata:
    name: ipl-pgdata
  ipl-app-pgdata:
    name: ipl-app-pgdata
