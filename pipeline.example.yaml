# Copy to pipeline.yaml (repo root) and point PIPELINE_CONFIG_PATH at its
# absolute path in .env. See packages/core/src/contracts/pipeline-config.ts
# for the full schema this is validated against.
version: 1

# Claude only -- the pipeline is deliberately single-vendor (the codex
# adapter was removed with the single-issue redesign). `adapter: claude` is
# the default and can be omitted; per-role args/timeouts/budgets still apply.
# The planner runs in Claude Code plan mode (read-only); executor/fixer run
# with bypassPermissions inside their isolated worktree.
roles:
  planner:
    adapter: claude
    args: []
    timeout_ms: 600000
    max_budget_usd: 2.0
  executor:
    adapter: claude
    args: []
    timeout_ms: 1800000
    max_budget_usd: 5.0
  fixer:
    adapter: claude
    args: []
    timeout_ms: 1200000
    max_budget_usd: 3.0

policy:
  local_gates: advisory
  max_fix_attempts: 2
  auto_continue: true
  # After all phases ship, the workflow polls the stack's PRs at this
  # interval until every one is merged, then closes the issue.
  merge_poll_minutes: 15

branching:
  stack_tool: graphite
  branch_prefix: pipe
  remote: origin
  pr_draft: false

gates:
  timeout_ms: 300000
  commands:
    - { name: typecheck, command: pnpm, args: ["turbo", "run", "typecheck"] }
    - { name: test, command: pnpm, args: ["turbo", "run", "test"] }
    - { name: lint, command: pnpm, args: ["turbo", "run", "lint"] }

repos:
  chronic-backend:
    github: Flagler-Health/chronic-backend
    local_path: ~/pipelines/chronic-backend/.repo
    default_branch: main
